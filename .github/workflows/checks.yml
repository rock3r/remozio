name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/check.sh
  linux-protocol:
    name: Linux Swift protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      gradle-key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Swift toolchain
        env:
          SWIFT_ARCHIVE_SHA256: 15608c4fa0364ef906014343d81639cf58169e8a40de2b2d3503c3f35a8bb66d
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxml2 libicu74 libsqlite3-dev libssl-dev
          curl --fail --location --retry 3 --max-time 300 \
            https://download.swift.org/swift-6.2.4-release/ubuntu2404/swift-6.2.4-RELEASE/swift-6.2.4-RELEASE-ubuntu24.04.tar.gz \
            --output "$RUNNER_TEMP/remozio-swift.tar.gz"
          printf '%s  %s\n' "$SWIFT_ARCHIVE_SHA256" "$RUNNER_TEMP/remozio-swift.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/remozio-swift"
          tar --extract --gzip --file "$RUNNER_TEMP/remozio-swift.tar.gz" \
            --strip-components=1 --directory "$RUNNER_TEMP/remozio-swift"
          echo "$RUNNER_TEMP/remozio-swift/usr/bin" >> "$GITHUB_PATH"
      - run: ./scripts/check-linux-protocol.sh
      - run: ./scripts/check-linux-host.sh
      - run: ./scripts/check-linux-pairing-peer.sh
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify wrapper JAR
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          actual = hashlib.sha256(Path('gradle/wrapper/gradle-wrapper.jar').read_bytes()).hexdigest()
          assert actual == '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d', actual
          PYTHON
      - name: Restore Gradle downloads
        id: gradle-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: gradle-downloads-v1-${{ github.job }}-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'gradle.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-downloads-v1-${{ github.job }}-${{ runner.os }}-
      - name: Pair the JVM phone client with the Linux software-key pairing tool
        run: ./gradlew :phone-core:linuxPairToolTest
      - name: Save Gradle downloads
        # Pull requests only restore, so a pull request cannot change the entries that main and other pull requests read.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Prepare private native TPM simulator dependencies
        run: |
          sudo apt-get install --yes --no-install-recommends \
            pkg-config libssl-dev tpm2-openssl swtpm tpm2-tools libtss2-tcti-tabrmd0 dbus-daemon
          mkdir -p "$RUNNER_TEMP/remozio-native-tpm-debs" "$RUNNER_TEMP/remozio-native-tpm-runtime"
          cd "$RUNNER_TEMP/remozio-native-tpm-debs"
          apt-get download tpm2-abrmd=3.0.0-1ubuntu2
          printf '%s  %s\n' \
            bd65b246104f6feac832c1cfcb100378be9b885b98a980441f77a7ccb0bf3241 \
            tpm2-abrmd_3.0.0-1ubuntu2_amd64.deb | sha256sum --check -
          # Extract the resource manager without installing or starting its system service.
          dpkg-deb --extract tpm2-abrmd_3.0.0-1ubuntu2_amd64.deb "$RUNNER_TEMP/remozio-native-tpm-runtime"
          dpkg-deb --field tpm2-abrmd_3.0.0-1ubuntu2_amd64.deb Package Version
          mkdir -p "$RUNNER_TEMP/remozio-native-tpm-runtime/usr/bin" "$RUNNER_TEMP/remozio-native-tpm-runtime/usr/lib"
          ln -s /usr/bin/tpm2 "$RUNNER_TEMP/remozio-native-tpm-runtime/usr/bin/tpm2"
          ln -s /usr/bin/swtpm "$RUNNER_TEMP/remozio-native-tpm-runtime/usr/bin/swtpm"
          ln -s /usr/lib/x86_64-linux-gnu "$RUNNER_TEMP/remozio-native-tpm-runtime/usr/lib/x86_64-linux-gnu"
          dpkg-query -W -f='${Package} ${Version}\n' \
            libssl-dev libssl3t64 tpm2-openssl swtpm tpm2-tools libtss2-tcti-tabrmd0
      - name: Build native Swift TPM provider probe
        run: |
          swift build --package-path experiments/linux-native-tpm-tls \
            --scratch-path "$RUNNER_TEMP/remozio-native-tpm-build" \
            --cache-path "$RUNNER_TEMP/remozio-native-tpm-cache" \
            --config-path "$RUNNER_TEMP/remozio-native-tpm-config" \
            --security-path "$RUNNER_TEMP/remozio-native-tpm-security" \
            --disable-keychain --disable-netrc --jobs 4
      - name: Exercise native Swift provider signing and private simulator TLS
        run: |
          timeout 120s python3 scripts/run-linux-native-tpm-tls-experiment.py \
            --simulator --runtime-root "$RUNNER_TEMP/remozio-native-tpm-runtime" \
            --probe "$RUNNER_TEMP/remozio-native-tpm-build/debug/NativeTPMProbe" \
            > "$RUNNER_TEMP/remozio-native-tpm-report.json"
      - name: Retain sanitized native TPM simulator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-tpm-simulator-${{ github.run_attempt }}
          path: ${{ runner.temp }}/remozio-native-tpm-report.json
          if-no-files-found: ignore
          retention-days: 7
  mac:
    name: Mac build
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      build-key: ${{ steps.build-cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Identify compatible Mac build cache
        id: build-cache-key
        run: python3 scripts/ci-build-cache.py key --scope mac --github-output "$GITHUB_OUTPUT"
      - name: Restore Mac compiler outputs
        id: build-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.build-cache-key.outputs.paths }}
          key: ${{ steps.build-cache-key.outputs.key }}
          restore-keys: ${{ steps.build-cache-key.outputs.restore-prefix }}
      - name: Restore timestamps of unchanged Mac inputs
        env:
          REMOZIO_CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
        run: python3 scripts/ci-build-cache.py restore --scope mac
      - name: Build the app and run the stages that inspect it or macos/core
        env:
          REMOZIO_CHECK_MAC_PART: app
        run: ./scripts/check.sh
      - name: Record validated Mac cache inputs
        id: build-cache-manifest
        run: python3 scripts/ci-build-cache.py save --scope mac --github-output "$GITHUB_OUTPUT"
      - name: Save validated Mac compiler outputs
        timeout-minutes: 5
        # Only main writes. A 3.5 GB entry per pull request evicted main's entry from the 10 GB budget.
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.build-cache.outputs.cache-hit != 'true' && steps.build-cache-manifest.outputs.save == 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.build-cache-key.outputs.paths }}
          key: ${{ steps.build-cache-key.outputs.key }}
      - name: Retain cache validation and native build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-build-cache-${{ github.run_attempt }}
          path: |
            .build/ci-cache-smoke/*.json
            .build/ci-cache-smoke/*.log
            .build/macos-app/xcodebuild-*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Diagnose native channel test crashes
        if: failure()
        timeout-minutes: 2
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess
          from pathlib import Path
          bundles = list(Path('macos/core/.build/debug').glob('RemozioCore*Tests.xctest'))
          if len(bundles) == 1:
              bundle = bundles[0]
              env = {'PATH': os.environ['PATH']}
              if 'DEVELOPER_DIR' in os.environ:
                  env['DEVELOPER_DIR'] = os.environ['DEVELOPER_DIR']
              runner = subprocess.check_output(['xcrun', '--find', 'xctest'], env=env, text=True).strip()
              subprocess.run(['xcrun', 'lldb', '--batch', '--no-lldbinit',
                  '--one-line', 'run', '--one-line-on-crash', 'thread backtrace all', '--', runner,
                  '-XCTest', 'RemozioCoreTests.NegotiatedNetworkChannelTests/testCoalescedAndFragmentedFramesSurviveNegotiation',
                  str(bundle.resolve())], env=env, timeout=90, check=False)
          PYTHON
  mac-experiments:
    name: Mac experiments
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      build-key: ${{ steps.build-cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Identify compatible Mac experiments cache
        id: build-cache-key
        run: python3 scripts/ci-build-cache.py key --scope experiments --github-output "$GITHUB_OUTPUT"
      - name: Restore Mac experiments compiler outputs
        id: build-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.build-cache-key.outputs.paths }}
          key: ${{ steps.build-cache-key.outputs.key }}
          restore-keys: ${{ steps.build-cache-key.outputs.restore-prefix }}
      - name: Restore timestamps of unchanged Mac inputs
        env:
          REMOZIO_CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
        run: python3 scripts/ci-build-cache.py restore --scope experiments
      - name: Run the Mac stages that need neither the app nor macos/core
        env:
          REMOZIO_CHECK_MAC_PART: experiments
        run: ./scripts/check.sh
      - name: Record validated Mac experiments cache inputs
        id: build-cache-manifest
        run: python3 scripts/ci-build-cache.py save --scope experiments --github-output "$GITHUB_OUTPUT"
      - name: Save validated Mac experiments compiler outputs
        timeout-minutes: 5
        # Only main writes, as for the Mac build cache.
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.build-cache.outputs.cache-hit != 'true' && steps.build-cache-manifest.outputs.save == 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.build-cache-key.outputs.paths }}
          key: ${{ steps.build-cache-key.outputs.key }}
  mac-core:
    name: Mac core tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Identify compatible Mac build cache
        id: build-cache-key
        run: python3 scripts/ci-build-cache.py key --scope mac --github-output "$GITHUB_OUTPUT"
      - name: Restore Mac compiler outputs
        id: build-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.build-cache-key.outputs.paths }}
          key: ${{ steps.build-cache-key.outputs.key }}
          restore-keys: ${{ steps.build-cache-key.outputs.restore-prefix }}
      - name: Restore timestamps of unchanged Mac inputs
        env:
          REMOZIO_CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
        run: python3 scripts/ci-build-cache.py restore --scope mac
      # Whole classes in three concurrent xctest processes. The Mac build job runs the classes that need the built app,
      # so a skip here other than the GUI-session control means a test silently lost its fixture.
      - name: Run macos/core tests in three concurrent class shards
        run: |
          python3 scripts/run-xctest-shards.py --package-path macos/core \
            --weights .github/macos-core-test-weights.json --shards 3 --concurrent --app-dependent exclude \
            --allowed-skips RemozioCoreTests.LiveOwnedJobInspectionTests/testOwnedGUIJobReconciliation \
            -- --triple arm64-apple-macosx26.0 -Xswiftc -O
      - name: Retain shard logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-core-shards-${{ github.run_attempt }}
          path: .build/xctest-shards/*.log
          if-no-files-found: ignore
          retention-days: 7
  mac-interop:
    name: Mac interoperability
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      build-key: ${{ steps.build-cache-key.outputs.key }}
      gradle-key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Identify compatible interoperability build cache
        id: build-cache-key
        run: python3 scripts/ci-build-cache.py key --scope interop --github-output "$GITHUB_OUTPUT"
      - name: Restore interoperability compiler outputs
        id: build-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.build-cache-key.outputs.paths }}
          key: ${{ steps.build-cache-key.outputs.key }}
          restore-keys: ${{ steps.build-cache-key.outputs.restore-prefix }}
      - name: Restore timestamps of unchanged interoperability inputs
        env:
          REMOZIO_CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
        run: python3 scripts/ci-build-cache.py restore --scope interop
      - name: Build native interoperability peers from this checkout
        run: python3 scripts/build-approval-flow.py
      # The cache smoke builds a disposable package; it needs no state from the Mac build job.
      - name: Verify fresh-checkout cache reuse and source invalidation
        run: python3 scripts/check-swift-cache.py
      - name: Verify wrapper JAR
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          actual = hashlib.sha256(Path('gradle/wrapper/gradle-wrapper.jar').read_bytes()).hexdigest()
          assert actual == '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d', actual
          PYTHON
      - name: Restore Gradle downloads
        id: gradle-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: gradle-downloads-v1-${{ github.job }}-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'gradle.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-downloads-v1-${{ github.job }}-${{ runner.os }}-
      - run: ./gradlew :phone-core:test :phone-core:approvalFlowTest
      - name: Save Gradle downloads
        # Pull requests only restore, so a pull request cannot change the entries that main and other pull requests read.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Record validated interoperability cache inputs
        id: build-cache-manifest
        run: python3 scripts/ci-build-cache.py save --scope interop --github-output "$GITHUB_OUTPUT"
      - name: Save validated interoperability compiler outputs
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.build-cache.outputs.cache-hit != 'true' && steps.build-cache-manifest.outputs.save == 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.build-cache-key.outputs.paths }}
          key: ${{ steps.build-cache-key.outputs.key }}
      - name: Retain cache smoke logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-cache-smoke-${{ github.run_attempt }}
          path: |
            .build/ci-cache-smoke/*.json
            .build/ci-cache-smoke/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  ios:
    name: iOS build
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      gradle-key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify wrapper JAR
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          actual = hashlib.sha256(Path('gradle/wrapper/gradle-wrapper.jar').read_bytes()).hexdigest()
          assert actual == '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d', actual
          PYTHON
      - run: xcodebuild -version
      - name: Restore Gradle downloads
        id: gradle-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: gradle-downloads-v1-${{ github.job }}-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'gradle.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-downloads-v1-${{ github.job }}-${{ runner.os }}-
      - name: Kotlin tests on the iOS simulator
        run: ./gradlew :protocol-kotlin:iosSimulatorArm64Test :phone-pairing:iosSimulatorArm64Test :phone-enrollment:iosSimulatorArm64Test :phone-ui:iosSimulatorArm64Test
      - name: Build the iOS app for the simulator
        env:
          REMOZIO_IOS_DERIVED_DATA: ${{ runner.temp }}/remozio-ios
        run: ./scripts/build-ios-app.sh
      - name: Native iOS tests on the simulator
        env:
          REMOZIO_IOS_DERIVED_DATA: ${{ runner.temp }}/remozio-ios
        run: ./scripts/test-ios-app.sh
      - name: Save Gradle downloads
        # Pull requests only restore, so a pull request cannot change the entries that main and other pull requests read.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
  kotlin:
    name: Kotlin protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      gradle-key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify wrapper JAR
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          actual = hashlib.sha256(Path('gradle/wrapper/gradle-wrapper.jar').read_bytes()).hexdigest()
          assert actual == '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d', actual
          PYTHON
      - name: Restore Gradle downloads
        id: gradle-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: gradle-downloads-v1-${{ github.job }}-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'gradle.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-downloads-v1-${{ github.job }}-${{ runner.os }}-
      - run: ./gradlew :protocol-kotlin:jvmTest :phone-pairing:jvmTest :phone-enrollment:jvmTest :phone-core:test :phone-ui:jvmTest :dev-invitation:test
      - name: Save Gradle downloads
        # Pull requests only restore, so a pull request cannot change the entries that main and other pull requests read.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
  android:
    name: Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      gradle-key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify wrapper JAR
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          actual = hashlib.sha256(Path('gradle/wrapper/gradle-wrapper.jar').read_bytes()).hexdigest()
          assert actual == '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d', actual
          PYTHON
      - name: Restore Gradle downloads
        id: gradle-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: gradle-downloads-v1-${{ github.job }}-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'gradle.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-downloads-v1-${{ github.job }}-${{ runner.os }}-
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - run: ./gradlew :android-app:testDebugUnitTest :android-app:assembleDebug :android-app:lintDebug :android-app:assembleRelease
      - name: Save Gradle downloads
        # Pull requests only restore, so a pull request cannot change the entries that main and other pull requests read.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
  cache-cleanup:
    name: Prune superseded main caches
    # Each main push saves new Mac outputs, and Gradle downloads when build files change. Two generations exceed the
    # 10 GB budget, so GitHub evicted entries, sometimes the Gradle ones that keep services.gradle.org out of a run.
    # This keeps the newest entry of each family plus every key this run saved, and deletes only main's entries.
    needs: [linux-protocol, mac, mac-experiments, mac-interop, ios, kotlin, android]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scripts/prune-ci-caches.py
          sparse-checkout-cone-mode: false
      - name: Delete superseded main cache entries
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_KEYS: >-
            ${{ needs.linux-protocol.outputs.gradle-key }}
            ${{ needs.mac.outputs.build-key }}
            ${{ needs.mac-experiments.outputs.build-key }}
            ${{ needs.mac-interop.outputs.build-key }}
            ${{ needs.mac-interop.outputs.gradle-key }}
            ${{ needs.ios.outputs.gradle-key }}
            ${{ needs.kotlin.outputs.gradle-key }}
            ${{ needs.android.outputs.gradle-key }}
        run: |
          set -- --repository "$GITHUB_REPOSITORY"
          for key in $KEEP_KEYS; do set -- "$@" --keep "$key"; done
          python3 scripts/prune-ci-caches.py "$@"
