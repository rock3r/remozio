name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/check.sh
  mac:
    name: Mac build
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: ./scripts/check.sh
      - name: Verify wrapper JAR
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          actual = hashlib.sha256(Path('gradle/wrapper/gradle-wrapper.jar').read_bytes()).hexdigest()
          assert actual == '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d', actual
          PYTHON
      - run: ./gradlew :phone-core:test :phone-core:approvalFlowTest
      - name: Report native test crashes
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import json
          import time
          from pathlib import Path
          reports = Path.home() / 'Library/Logs/DiagnosticReports'
          for attempt in range(5):
              crashes = sorted(reports.glob('xctest*.ips'))
              if crashes:
                  break
              time.sleep(1)
          for path in crashes:
              text = path.read_text()
              _, end = json.JSONDecoder().raw_decode(text)
              report = json.loads(text[end:])
              print(path.name, report.get('exception'), report.get('termination'))
              images = report.get('usedImages', [])
              for thread in report.get('threads', []):
                  if not thread.get('triggered'):
                      continue
                  for frame in thread.get('frames', []):
                      index = frame.get('imageIndex', -1)
                      image = images[index] if 0 <= index < len(images) else {}
                      print(image.get('name'), frame)
          if not crashes:
              print('No XCTest crash report was available.')
          PYTHON
  kotlin:
    name: Kotlin protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify wrapper JAR
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          actual = hashlib.sha256(Path('gradle/wrapper/gradle-wrapper.jar').read_bytes()).hexdigest()
          assert actual == '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d', actual
          PYTHON
      - run: ./gradlew :protocol-kotlin:test :phone-core:test
  android:
    name: Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify wrapper JAR
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          actual = hashlib.sha256(Path('gradle/wrapper/gradle-wrapper.jar').read_bytes()).hexdigest()
          assert actual == '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d', actual
          PYTHON
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - run: ./gradlew :android-app:testDebugUnitTest :android-app:assembleDebug :android-app:lintDebug :android-app:assembleRelease
