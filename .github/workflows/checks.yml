name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./scripts/check.sh
  linux-protocol:
    name: Linux Swift protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Swift toolchain
        env:
          SWIFT_ARCHIVE_SHA256: 15608c4fa0364ef906014343d81639cf58169e8a40de2b2d3503c3f35a8bb66d
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxml2 libicu74
          curl --fail --location --retry 3 --max-time 300 \
            https://download.swift.org/swift-6.2.4-release/ubuntu2404/swift-6.2.4-RELEASE/swift-6.2.4-RELEASE-ubuntu24.04.tar.gz \
            --output "$RUNNER_TEMP/remozio-swift.tar.gz"
          printf '%s  %s\n' "$SWIFT_ARCHIVE_SHA256" "$RUNNER_TEMP/remozio-swift.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/remozio-swift"
          tar --extract --gzip --file "$RUNNER_TEMP/remozio-swift.tar.gz" \
            --strip-components=1 --directory "$RUNNER_TEMP/remozio-swift"
          echo "$RUNNER_TEMP/remozio-swift/usr/bin" >> "$GITHUB_PATH"
      - run: ./scripts/check-linux-protocol.sh
  mac:
    name: Mac build
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: ./scripts/check.sh
      - name: Diagnose native channel test crashes
        if: failure()
        timeout-minutes: 2
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess
          from pathlib import Path
          bundles = list(Path('macos/core/.build/debug').glob('RemozioCore*Tests.xctest'))
          if len(bundles) == 1:
              bundle = bundles[0]
              env = {'PATH': os.environ['PATH']}
              if 'DEVELOPER_DIR' in os.environ:
                  env['DEVELOPER_DIR'] = os.environ['DEVELOPER_DIR']
              runner = subprocess.check_output(['xcrun', '--find', 'xctest'], env=env, text=True).strip()
              subprocess.run(['xcrun', 'lldb', '--batch', '--no-lldbinit',
                  '--one-line', 'run', '--one-line-on-crash', 'thread backtrace all', '--', runner,
                  '-XCTest', 'RemozioCoreTests.NegotiatedNetworkChannelTests/testCoalescedAndFragmentedFramesSurviveNegotiation',
                  str(bundle.resolve())], env=env, timeout=90, check=False)
          PYTHON
  mac-interop:
    name: Mac interoperability
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build native interoperability peers from this checkout
        run: python3 scripts/build-approval-flow.py
      - name: Verify wrapper JAR
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          actual = hashlib.sha256(Path('gradle/wrapper/gradle-wrapper.jar').read_bytes()).hexdigest()
          assert actual == '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d', actual
          PYTHON
      - run: ./gradlew :phone-core:test :phone-core:approvalFlowTest
  kotlin:
    name: Kotlin protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify wrapper JAR
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          actual = hashlib.sha256(Path('gradle/wrapper/gradle-wrapper.jar').read_bytes()).hexdigest()
          assert actual == '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d', actual
          PYTHON
      - run: ./gradlew :protocol-kotlin:test :phone-core:test
  android:
    name: Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify wrapper JAR
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          actual = hashlib.sha256(Path('gradle/wrapper/gradle-wrapper.jar').read_bytes()).hexdigest()
          assert actual == '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d', actual
          PYTHON
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - run: ./gradlew :android-app:testDebugUnitTest :android-app:assembleDebug :android-app:lintDebug :android-app:assembleRelease
